<p-dialog
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: 'min(100vw - 2rem, 520px)' }"
  header="Register tablet"
  styleClass="border-surface-200"
>
  <p class="text-muted-color mb-4 text-sm">
    Adds a <strong class="text-color">Pending</strong> device to inventory by serial.
    Pairing to a vehicle happens on
    <a routerLink="/devices/pairing" class="text-primary font-semibold">Pairing queue</a>
    or the vehicle workspace — not here.
  </p>

  <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()">
    <div class="flex flex-col gap-2">
      <label for="serialNumber" class="text-color text-sm font-semibold"
        >Serial number <span class="text-red-500">*</span></label
      >
      <input
        id="serialNumber"
        class="p-inputtext p-component w-full"
        formControlName="serialNumber"
        autocomplete="off"
        placeholder="e.g. TAB-042-SN"
      />
    </div>
    <p class="text-muted-color border-surface-200 border-t pt-2 text-xs">
      Optional — tablet reports accurate values on first connection if left blank.
    </p>
    <div class="grid grid-cols-2 gap-3">
      <div class="flex flex-col gap-2">
        <label for="inch" class="text-sm font-semibold">Diagonal (in)</label>
        <input
          id="inch"
          type="number"
          step="0.1"
          class="p-inputtext p-component w-full"
          formControlName="screenSizeInches"
          placeholder="Optional"
        />
      </div>
      <div class="flex flex-col gap-2">
        <label for="gb" class="text-sm font-semibold">Storage (GB)</label>
        <input
          id="gb"
          type="number"
          class="p-inputtext p-component w-full"
          formControlName="storageCapacityGb"
          placeholder="Optional"
        />
      </div>
    </div>
    <div class="flex flex-col gap-2">
      <label for="os" class="text-sm font-semibold">OS version</label>
      <input
        id="os"
        class="p-inputtext p-component w-full"
        formControlName="osVersion"
        placeholder="Optional"
      />
    </div>
    <div class="mt-2 flex justify-end gap-2">
      <button
        pButton
        type="button"
        class="p-button-text"
        [disabled]="submitting"
        (click)="visibleChange.emit(false)"
      >
        Cancel
      </button>
      <button
        pButton
        type="submit"
        [loading]="submitting"
        [disabled]="submitting"
      >
        Register device
      </button>
    </div>
  </form>
</p-dialog>
