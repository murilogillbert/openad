<header
  class="border-surface-200 bg-surface-50 dark:border-surface-300 dark:bg-surface-100 fixed left-0 right-0 top-0 z-30 border-b transition-transform duration-300 ease-out"
  [class.-translate-y-full]="!topBarLayout.headerVisible()"
>
  <div class="flex w-full items-center justify-between px-4 py-4">
    <a
      routerLink="/dashboard"
      class="app-font-display flex items-center gap-2 text-2xl font-black tracking-tighter text-primary no-underline dark:text-primary"
    >
      <img src="/logo.svg" width="28" height="28" alt="OpenAD" class="h-7 w-7 shrink-0" />
      <span>OpenAD</span>
    </a>
    <div class="flex items-center gap-2">
      <button
        type="button"
        class="border-primary/20 text-primary hover:bg-primary/10 relative flex h-10 w-10 items-center justify-center overflow-hidden rounded-full border transition-transform hover:scale-105 active:scale-95"
        (click)="openProfileMenu()"
        aria-label="Account menu"
      >
        <span class="material-symbols-outlined filled text-2xl">account_circle</span>
      </button>
    </div>
  </div>
</header>

<p-dialog
  [visible]="profileDialogVisible()"
  (visibleChange)="profileDialogVisible.set($event)"
  [modal]="true"
  [dismissableMask]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="true"
  [style]="{ width: 'min(20rem, calc(100vw - 2rem))' }"
  [breakpoints]="{ '576px': '95vw' }"
  header="Account"
  styleClass="account-sheet-dialog"
  appendTo="body"
  (onHide)="closeProfileMenu()"
>
  <div class="flex flex-col gap-1 pt-1">
    <p class="text-muted-color text-xs font-medium">
      {{ auth.shellDisplayName() }}
    </p>
    <div class="mt-2 flex flex-col gap-2">
      <p-button
        label="Settings"
        icon="pi pi-cog"
        [outlined]="true"
        severity="secondary"
        styleClass="w-full"
        routerLink="/settings"
        (onClick)="closeProfileMenu()"
      />
    </div>
    <p-button
      label="Log out"
      icon="pi pi-sign-out"
      [outlined]="true"
      severity="danger"
      styleClass="w-full"
      (onClick)="logout()"
    />
  </div>
</p-dialog>
