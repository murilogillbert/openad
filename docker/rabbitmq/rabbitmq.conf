# Configuração do RabbitMQ 4 do openad.
#
# Existe porque o RabbitMQ 4 **recusa subir** com as variáveis de ambiente antigas: definir
# `RABBITMQ_VM_MEMORY_HIGH_WATERMARK` faz o entrypoint abortar com
# "deprecated environment variables detected", e o contêiner entra em laço de reinício. O
# valor tem de vir daqui.

# Marca d'água de memória em valor **absoluto**.
#
# O padrão é 0,4 da RAM que o RabbitMQ enxerga, e ele enxerga a do **host** (7,8 GB), não o
# limite do cgroup (512 MB) — pediria ~3,1 GB e seria morto pelo OOM killer. Em valor
# absoluto, ele aplica contrapressão aos publicadores antes de chegar ao teto do cgroup:
# degrada em vez de morrer, que é o comportamento desejável num broker.
#
# 384 MB contra um limite de 512 MB deixa margem para o runtime do Erlang, que não é contado
# nesta marca.
vm_memory_high_watermark.absolute = 384MB

# Disco: abaixo disso o broker bloqueia publicação. A VPS tem 77 GB livres, então isto é só
# uma rede de segurança — o padrão (50 MB) é otimista para um servidor que também guarda
# vídeo e backup.
disk_free_limit.absolute = 2GB

# MQTT sobre WebSocket, que é o caminho usado pelos tablets: o proxy do Cloudflare não
# encaminha TCP bruto nas portas 1883/8883. O caminho padrão do plugin é `/ws`.
#
# `mqtt.allow_anonymous = false` é o ponto que importa: o padrão do plugin é **permitir**
# anônimo, e cada tablete recebe usuário e senha próprios no pareamento, com ACL por tópico.
# Com anônimo liberado, qualquer um que alcance o broker publica comando na frota — incluindo
# troca de conteúdo e reinício.
mqtt.allow_anonymous = false
mqtt.vhost = /
mqtt.exchange = amq.topic

# Sessões de dispositivo são limpas, não duráveis: o tablete reassina os tópicos no boot, e
# fila durável por tablete acumularia mensagem para aparelho que saiu de campo.
#
# O nome antigo era `mqtt.subscription_ttl`, em milissegundos. O RabbitMQ 3.13 passou a
# **recusar a configuração inteira** com ele presente ("found invalid configuration"), o que
# deixa o broker em laço de reinício — o mesmo sintoma que a variável de ambiente depreciada
# já havia causado. O substituto é em segundos: 1800000 ms = 1800 s.
mqtt.max_session_expiry_interval_seconds = 1800

# O log em formato de console, para `docker logs` ser legível.
log.console = true
log.console.level = info
log.file = false
