%% EMQX 5 file-based authorization (see docker-compose.yml).
%% Placeholders: %c = MQTT client id (must equal device UUID for devices).
%% Deny by default (EMQX_AUTHORIZATION__NO_MATCH=deny); only explicit allows pass.

{allow, {ipaddr, "127.0.0.1"}, all}.
{allow, {ipaddr, "::1"}, all}.
{allow, all, subscribe, ["openad/%c/#"]}.
{allow, all, publish, ["openad/%c/#"]}.
{deny, all}.
