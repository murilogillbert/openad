# Local stack: RabbitMQ (MQTT plugin), MongoDB 7.x, Redis 7.x, SeaweedFS (S3 + filer UI).
#
# Storage: era MinIO. As imagens comunitarias da MinIO deixaram de ser pullaveis
# (`minio/minio` e `quay.io/minio/minio` respondem 401/denied, e `bitnami/minio` saiu do
# catalogo gratuito), o que travava o `docker compose up` inteiro. Trocado por SeaweedFS,
# que expoe a mesma API S3 na mesma porta com as mesmas credenciais — nenhum `.env` muda.
# Producao nao e afetada: usa Cloudflare R2 (ver `.env.example`, secao C).
#
# `pnpm docker:up` loads `docker/.env` + `docker/.env.<dev|test|prod>` via `scripts/with-monorepo-env.sh docker`.
#
# MongoDB: first-time init only — if you already have `openad-mongo-data` from a no-auth image,
# run `docker compose down -v` (or delete that volume) once so `MONGO_INITDB_*` can create the root user.

services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: openad-rabbitmq
    hostname: openad-rabbitmq
    ports:
      - "127.0.0.1:${MQTT_PORT:-1884}:1883"
      - "127.0.0.1:${MQTT_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${MQTT_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${MQTT_MANAGEMENT_USER:-openad}
      RABBITMQ_DEFAULT_PASS: ${MQTT_MANAGEMENT_PASSWORD:-openad-dev-mqtt}
    volumes:
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - openad-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s

  mongo:
    image: mongo:7.0
    container_name: openad-mongo
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-openad}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-openad-dev-mongo}
    volumes:
      - openad-mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ ping: 1 }).ok" | grep -q 1 || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Postgres do ecossistema. Em producao e um banco **compartilhado** chamado `hub`, com o
  # schema `public` do hub, o schema `opendriver` e, a partir da federacao de identidade, o
  # schema `openad`. O nome do banco aqui e `hub` de proposito, para que a string de conexao
  # local tenha a mesma forma da de producao.
  #
  # O schema `public` e propriedade do hub: as migrations dele e que o criam. Use
  # `node scripts/init-postgres-schemas.mjs`, que aplica as migrations do hub a partir do
  # repositorio irmao e depois as do openad. Nenhuma migration deste repositorio toca `public`.
  postgres:
    image: postgres:16-alpine
    container_name: openad-postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hub}
      POSTGRES_USER: ${POSTGRES_USER:-openad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openad-dev-postgres}
    volumes:
      - openad-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: openad-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - openad-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    # Substituto S3-compatible da MinIO (ver nota no topo do arquivo). O nome do servico
    # segue `minio` para nao quebrar `docker compose up minio` em scripts e documentacao;
    # as credenciais vem de `docker/seaweedfs/s3.json` e precisam bater com S3_ACCESS_KEY_ID /
    # S3_SECRET_ACCESS_KEY do `docker/.env.dev` e do `app/openad-api/.env.dev`.
    image: chrislusf/seaweedfs:latest
    container_name: openad-minio
    ports:
      # API S3 na mesma porta que a MinIO usava, para S3_ENDPOINT seguir inalterado.
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      # UI do filer, no lugar do console da MinIO.
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:8888"
    command:
      - server
      - -dir=/data
      - -master.volumeSizeLimitMB=1024
      - -volume.max=0
      - -filer
      - -s3
      - -s3.port=9000
      - -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - openad-minio-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:9333/cluster/status >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  openad-mongo-data:
  openad-redis-data:
  openad-rabbitmq-data:
  openad-minio-data:
  openad-postgres-data:
