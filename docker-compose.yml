# Local stack: RabbitMQ (MQTT plugin), MongoDB 7.x, Redis 7.x, MinIO (S3 + embedded console).
# Embedded MinIO Console removed in minio/minio RELEASE.2025-05-24T17-08-30Z; we pin the prior
# release so `pnpm docker:up` still gets a browser UI without a separate console image.
# `pnpm docker:up` loads `docker/.env` + `docker/.env.<dev|test|prod>` via `scripts/with-monorepo-env.sh docker`.
#
# MongoDB: first-time init only — if you already have `openad-mongo-data` from a no-auth image,
# run `docker compose down -v` (or delete that volume) once so `MONGO_INITDB_*` can create the root user.

services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: openad-rabbitmq
    hostname: openad-rabbitmq
    ports:
      - "127.0.0.1:${MQTT_PORT:-1884}:1883"
      - "127.0.0.1:${MQTT_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${MQTT_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${MQTT_MANAGEMENT_USER:-openad}
      RABBITMQ_DEFAULT_PASS: ${MQTT_MANAGEMENT_PASSWORD:-openad-dev-mqtt}
    volumes:
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - openad-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s

  mongo:
    image: mongo:7.0
    container_name: openad-mongo
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-openad}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-openad-dev-mongo}
    volumes:
      - openad-mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ ping: 1 }).ok" | grep -q 1 || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7.4-alpine
    container_name: openad-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - openad-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    # Last release with embedded Console UI in the server image (breaking removal: 2025-05-24).
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: openad-minio
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - openad-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  openad-mongo-data:
  openad-redis-data:
  openad-rabbitmq-data:
  openad-minio-data:
