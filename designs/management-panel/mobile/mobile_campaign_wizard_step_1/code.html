<div class="flex justify-between items-end mb-2">

<input class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3.5 text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary/30 transition-shadow" placeholder="e.g. TechFlow Solutions" type="text"/>
</div>
</section>

<section class="mb-12">
<h3 class="text-lg font-bold font-headline tracking-tight text-on-surface mb-6">Select Layout Template</h3>

<div class="bg-surface-container-lowest p-4 rounded-xl flex items-center gap-4 ring-1 ring-outline-variant/15 group-hover:ring-primary/40 transition-all shadow-sm">

<span class="material-symbols-outlined text-primary/40" data-icon="fullscreen">fullscreen</span>

<div class="flex-1">
<p class="font-bold text-on-surface text-sm">Full Screen Video</p>
<p class="text-xs text-on-surface-variant">Maximize visual impact with zero borders.</p>
</div>
<span class="material-symbols-outlined text-primary opacity-0 group-hover:opacity-100 transition-opacity" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>

<p class="text-xs text-on-surface-variant">Primary content with sidebar details.</p>
</div>
<span class="material-symbols-outlined text-primary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>

<div class="bg-surface-container-lowest p-4 rounded-xl flex items-center gap-4 ring-1 ring-outline-variant/15 group-hover:ring-primary/40 transition-all shadow-sm">

<div class="bg-surface-container-lowest p-4 rounded-xl flex items-center gap-4 ring-1 ring-outline-variant/15 group-hover:ring-primary/40 transition-all shadow-sm">
<div class="w-16 h-16 bg-surface-container rounded-lg flex gap-1 p-1 shrink-0">
<div class="w-1/2 bg-surface-variant rounded-sm"></div>
<div class="w-1/2 bg-surface-variant rounded-sm"></div>

<div class="flex-1">

<span class="material-symbols-outlined text-primary opacity-0 group-hover:opacity-100 transition-opacity" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
