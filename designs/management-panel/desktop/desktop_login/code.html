<img alt="OpenAd Professional Logo" class="h-10 w-auto object-contain" data-alt="minimalist corporate logo with clean geometric lines and a tech-forward aesthetic using professional blue and white" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCAo4VnIhPeniBlNL5Sm_kl0idwMz17CoSGyxVJnEbLWINuLzhClSuWYgW1OYRSnvYO92DlVCZqaLdttKkut5BIISUqex-C3p3pRAlgzfMThQEORQHAyroaCR6NPvmv55suZ7EnXs9zCuZhXhXq2zazeKVUT14rfOJ1Ll9xppPD012MXe5SPreAo7Y7LPz-W7YRsTF4pcimPGLSfDIS-UjZJK79lZo9ilXNaSiXMMj1bnQK29qorXdzKqqZ60ct1Hm2u-05veQwU_ZB"/>

</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-4 w-full max-w-4xl">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl tonal-layer-shadow p-10 flex flex-col gap-8">
<!-- Form Header -->
<div class="text-center">
<h1 class="text-3xl font-headline font-extrabold tracking-tighter text-on-surface mb-2">Welcome Back</h1>
<p class="text-on-surface-variant font-body text-sm">Enter your credentials to access the DOOH console.</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-6">
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="text-xs font-label font-semibold text-on-surface-variant uppercase tracking-wider" for="email">Email</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline-variant text-lg">mail</span>
<input class="w-full bg-surface-container-low border-none rounded-lg py-3 pl-11 pr-4 text-on-surface focus:ring-2 focus:ring-primary/30 transition-all font-body text-sm" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<label class="text-xs font-label font-semibold text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline-variant text-lg">lock</span>
<input class="w-full bg-surface-container-low border-none rounded-lg py-3 pl-11 pr-4 text-on-surface focus:ring-2 focus:ring-primary/30 transition-all font-body text-sm" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Primary Action -->
<button class="signature-gradient text-on-primary font-headline font-bold py-4 rounded-lg hover:scale-[1.02] active:scale-95 transition-all duration-150 mt-2 flex items-center justify-center gap-2" type="submit">
                    Login
                    <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</form>
<!-- Atmospheric Accent -->
<div class="mt-4 flex flex-col items-center gap-4">
<div class="w-12 h-1 signature-gradient rounded-full opacity-30"></div>
<p class="text-xs text-on-surface-variant/60 font-label text-center">Precision Atmosphere DOOH Management Platform</p>
</div>
</div>
