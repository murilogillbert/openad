# Infraestrutura e serviços do openad em produção.
#
# Roda **ao lado** da pilha que já existe no servidor (Coolify, Postgres compartilhado,
# hub-minio, backends do hub e do opendriver). Não duplica nada disso:
#
#   - **Postgres**: usa o container existente, pela rede `coolify`. Um segundo Postgres
#     quebraria a premissa do ecossistema de um banco só com três schemas.
#   - **Armazenamento S3**: usa o `hub-minio` existente, por decisão de 2026-10-03.
#   - **TLS e domínios**: terminam no Traefik do Coolify, por label.
#
# O que é novo e exclusivo do openad: MongoDB (operação e telemetria), Redis (BullMQ e
# pub/sub) e RabbitMQ com plugin MQTT (plano de dispositivo dos tablets).
#
# ---------------------------------------------------------------------------------------
# Memória: a VPS tem 2 vCPU e 7,8 GB, com ~4,1 GB disponíveis.
# ---------------------------------------------------------------------------------------
# Todo serviço tem limite declarado, e isso não é zelo: sem limite, o MongoDB reserva cache
# até metade da RAM visível e o RabbitMQ usa 40% como marca d'água — somados, os dois
# sozinhos passariam do que existe livre. O resultado seria o OOM killer escolhendo a vítima,
# e ele tende a escolher o processo maior, que aqui seria o Postgres **compartilhado pelos
# três serviços**. Limitar é o que mantém a falha contida no openad.
#
# Orçamento: Mongo 1,2 G + Redis 256 M + RabbitMQ 512 M + API 768 M + portal 64 M ≈ 2,8 G,
# deixando folga para o que já roda.

name: openad

networks:
  # Rede do Coolify, onde vivem o Postgres compartilhado, o hub-minio e o Traefik.
  coolify:
    external: true
  # Rede interna do openad. Mongo, Redis e RabbitMQ ficam **só** aqui: nenhum deles precisa
  # ser alcançado de fora, e porta publicada é a diferença entre um serviço interno e um
  # serviço exposto à internet.
  openad-interna:
    driver: bridge

volumes:
  openad-mongo-data:
  openad-mongo-config:
  openad-redis-data:
  openad-rabbitmq-data:

services:
  # -------------------------------------------------------------------------------------
  # MongoDB — operação e telemetria (frota, mídia, entrega, eventos, 28 collections)
  # -------------------------------------------------------------------------------------
  mongo:
    image: mongo:7
    container_name: openad-mongo
    restart: unless-stopped
    networks: [openad-interna]
    environment:
      # ATENÇÃO: estas duas só têm efeito na **criação** do volume. Se o contêiner subir sem
      # elas uma vez, acrescentá-las depois não liga a autenticação — é preciso recriar o
      # volume. Um Mongo sem senha é comprometido em horas.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?defina MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?defina MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: openad
    # `--wiredTigerCacheSizeGB` explícito porque o padrão é `max(0,5 GB, (RAM-1G)/2)`, e o
    # Mongo lê a RAM do **host**, não o limite do contêiner: ele pediria ~3,4 GB e seria morto
    # pelo cgroup. O cache é a maior parte do consumo, então é ele que precisa ser dito.
    command: >
      mongod
      --wiredTigerCacheSizeGB 0.5
      --bind_ip_all
    volumes:
      - openad-mongo-data:/data/db
      - openad-mongo-config:/data/configdb
    deploy:
      resources:
        limits:
          memory: 1200M
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ping:1}).ok']
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    logging: &log
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # -------------------------------------------------------------------------------------
  # Redis — filas BullMQ, cache e pub/sub do painel
  # -------------------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: openad-redis
    restart: unless-stopped
    networks: [openad-interna]
    # `appendonly yes` porque o Redis aqui guarda **fila**, não só cache: um lote de analytics
    # enfileirado e não processado some num reinício sem persistência, e com ele as
    # veiculações faturáveis daquele lote.
    #
    # `maxmemory-policy noeviction` é o ponto que importa: com `allkeys-lru`, o Redis
    # descartaria silenciosamente chaves de job do BullMQ ao chegar no teto — perda de dado
    # faturável disfarçada de funcionamento normal. Com `noeviction`, a escrita falha e o erro
    # aparece.
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 200mb
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD:?defina REDIS_PASSWORD}
    volumes:
      - openad-redis-data:/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging: *log

  # -------------------------------------------------------------------------------------
  # RabbitMQ + plugin MQTT — plano de dispositivo dos tablets
  # -------------------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: openad-rabbitmq
    restart: unless-stopped
    networks: [openad-interna, coolify]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?defina RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD}
    volumes:
      - openad-rabbitmq-data:/var/lib/rabbitmq
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      # A marca d'água de memória vem de arquivo, **não** de variável de ambiente: o
      # RabbitMQ 4 recusa subir com `RABBITMQ_VM_MEMORY_HIGH_WATERMARK` definida
      # ("deprecated environment variables detected") e entra em laço de reinício. Ver a nota
      # no próprio `rabbitmq.conf`.
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    labels:
      # MQTT sobre WebSocket seguro, pela porta 15675 do `rabbitmq_web_mqtt`.
      #
      # O proxy do Cloudflare encaminha HTTP e WebSocket na 443, mas **não** TCP bruto nas
      # 1883/8883 — isso é Spectrum, plano Enterprise. Então o caminho é WSS, e ele já
      # funciona sem build novo de APK: o `brokerUrl` é entregue a cada tablete na resposta do
      # pareamento, não compilado no aplicativo.
      #
      # As portas 1883 e 15672 **não** são publicadas: a 1883 não é usada neste desenho e a
      # 15672 é o painel de administração.
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.openad-mqtt.rule=Host(`mqtt.opendriver.com.br`)
      - traefik.http.routers.openad-mqtt.entrypoints=https
      - traefik.http.routers.openad-mqtt.tls.certresolver=letsencrypt
      - traefik.http.services.openad-mqtt.loadbalancer.server.port=15675
    logging: *log

  # -------------------------------------------------------------------------------------
  # API
  # -------------------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: openad-api:latest
    container_name: openad-api
    restart: unless-stopped
    # `coolify` para alcançar o Postgres compartilhado e o hub-minio; `openad-interna` para
    # Mongo, Redis e RabbitMQ.
    networks: [openad-interna, coolify]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 3000

      # `?schema=openad` é obrigatório, e a validação de ambiente recusa o boot sem ele: sem o
      # parâmetro, o histórico de migrations do openad iria para o schema do hub.
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL com ?schema=openad}

      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@openad-mongo:27017/openad?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@openad-redis:6379
      MQTT_URL: mqtt://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@openad-rabbitmq:1883

      # Os nomes são `MQTT_MANAGEMENT_*`, não `RABBITMQ_MANAGEMENT_*`: é o que
      # `MqttBrokerHealthIndicator` lê. Com os nomes errados, ele caía no padrão
      # `http://127.0.0.1:15672` — o próprio contêiner da API, onde não há broker — e
      # `/api/health` respondia 503 para sempre.
      # As mesmas três também são o que `RabbitmqManagementService` usa para criar o usuário
      # MQTT de cada tablete com ACL por tópico. `RABBITMQ_MANAGEMENT_URL`, `RABBITMQ_USER` e
      # `RABBITMQ_PASSWORD` estavam aqui antes e **nenhuma delas é lida pela aplicação** — não
      # existe um único `process.env.RABBITMQ_USER` no código da API.
      MQTT_MANAGEMENT_URL: http://openad-rabbitmq:15672
      MQTT_MANAGEMENT_USER: ${RABBITMQ_USER}
      MQTT_MANAGEMENT_PASSWORD: ${RABBITMQ_PASSWORD}

      # O `brokerUrl` entregue ao tablete no pareamento. É WSS porque o Cloudflare não
      # encaminha TCP bruto — ver a nota no serviço `rabbitmq`.
      MQTT_PUBLIC_BROKER_URL: wss://mqtt.opendriver.com.br/ws

      # **Idêntico** ao do hub e do opendriver: é o que faz um token de um valer nos três. A
      # validação recusa menos de 32 caracteres.
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET igual ao do hub}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?defina JWT_REFRESH_SECRET}

      # Armazenamento: o `hub-minio` que já existe, alcançado pela rede do Coolify.
      MEDIA_STORAGE_BACKEND: s3
      S3_ENDPOINT: http://hub-minio:9000

      # Endereço **público** do mesmo MinIO, usado só para assinar URL.
      #
      # Sem isto, `AssetStorageService` assina com o endpoint interno e o manifesto entrega ao
      # tablet `http://hub-minio:9000/openad-media/…`. O aparelho não resolve esse nome,
      # nenhum criativo baixa e a tela fica vazia — era exatamente o que estava acontecendo:
      # 4 criativos aprovados, 3 campanhas ativas, `lastManifestVersion: 0` no aparelho e
      # zero registros de reprodução.
      #
      # A assinatura SigV4 inclui o host, então não dá para assinar com um endereço e servir
      # por outro: é preciso que o cliente de assinatura aponte para o domínio que o tablet
      # vai abrir. Leitura e upload servidor-a-servidor continuam pelo endpoint interno.
      #
      # `openad-media` é privado (leitura anônima devolve 403, conferido até para objeto
      # existente), logo expor o caminho no domínio público não expõe criativo: sem assinatura
      # válida e no prazo, o MinIO recusa.
      S3_PUBLIC_ENDPOINT: https://storage.opendriver.com.br

      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-openad-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?defina S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?defina S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: 'true'
      PUBLIC_ASSET_BASE_URL: https://adsapi.opendriver.com.br

      # Repasse ao motorista: o openad credita `opendriver.driver_earnings` por HTTP, porque
      # aquele schema não é propriedade dele.
      #
      # O endereço é o **domínio público**, não o nome do contêiner. O Coolify renomeia o
      # contêiner em cada deploy (`cag0pegfzuz1zfhkxgjsfzf2-000753239468` virou
      # `...-134608006407` no primeiro redeploy) e **não** registra alias estável pelo uuid —
      # verificado: `http://cag0pegfzuz1zfhkxgjsfzf2:5100` não resolve. Apontar para o nome do
      # contêiner significaria quebrar o repasse em todo deploy do opendriver, e quebrar em
      # silêncio: `DriverEarningClient.creditar` trata falha como "desligado", registra em log
      # e segue, de modo que o prejuízo apareceria só na conferência de `/internal/ads/payouts`.
      #
      # O custo é um salto pelo Traefik no mesmo host, com TLS. É o preço de um endereço que
      # não muda.
      OPENDRIVER_API_URL: ${OPENDRIVER_API_URL:-https://api-app.opendriver.com.br}
      # Sem `:?` de propósito: a ausência desta chave **não** deve impedir o boot.
      #
      # `DriverEarningClient.creditar` já trata a falta de configuração como "desligado",
      # registra em log e devolve `false` — e o repasse perdido é recuperável pela conferência
      # em `/internal/ads/payouts`. Exigir a chave aqui trocaria uma degradação visível e
      # reversível por um serviço que não sobe, o que é estritamente pior.
      ECOSYSTEM_SERVICE_API_KEY: ${ECOSYSTEM_SERVICE_API_KEY:-}

      # API do hub, usada por `PixChargeClient` para pedir a cobrança Pix do crédito de
      # veiculação. A conta do Asaas é do hub e as credenciais vivem em
      # `public.integration_settings`, que é dele — então o openad pede, o hub cobra.
      #
      # Mesmo raciocínio do endereço do opendriver: domínio público, não nome de contêiner,
      # porque o Coolify renomeia o contêiner em cada deploy e não registra alias pelo uuid.
      #
      # Sem `:?`: faltando a URL, `PixChargeClient.habilitado()` é `false` e a rota de compra
      # responde 503 com `PIX_NOT_CONFIGURED` — mensagem que manda o anunciante ao suporte, e
      # o operador ao lançamento manual em `/internal/ads/credits/adjust`. É degradação de uma
      # função, não motivo para o serviço não subir.
      HUB_API_URL: ${HUB_API_URL:-https://hubapi.opendriver.com.br}

      # ----------------------------------------------------------------- mais de uma instancia
      #
      # As tres variaveis abaixo so importam quando houver uma SEGUNDA replica da API. Com uma
      # instancia, os padroes atuais sao os corretos e nada precisa ser definido.
      #
      # `ASSET_URL_SIGNING_SECRET` e a excecao: ela nao e sobre escala, e passou a ser exigida no
      # boot. Antes caia para uma constante do repositorio
      # (`dev-asset-url-secret-change-me`), e as URLs de criativo sao buscadas pelos aparelhos
      # SEM JWT — qualquer pessoa que lesse o repositorio podia assinar uma URL valida por 24 h.
      # Como ela cai para `JWT_SECRET` (que ja e obrigatorio), nao e preciso definir aqui.
      #
      #   OPENAD_SCHEDULERS_DISABLED=true   a replica nao roda @Cron. Alternativa ao lock de
      #                                     Redis, que ja cobre os seis agendadores.
      #   OPENAD_MQTT_INGEST_DISABLED=true  a replica nao assina topico MQTT. Necessario porque
      #                                     o suporte a `$share` no RabbitMQ 4.3 nao esta
      #                                     confirmado; sem isso, cada mensagem e processada N
      #                                     vezes (ack de comando e comando prioritario
      #                                     escrevem e notificam por mensagem).
      #   REDIS_URL                         ja definida; com ela o Socket.IO usa o adapter de
      #                                     Redis e o painel recebe evento de qualquer replica.
      OPENAD_SCHEDULERS_DISABLED: ${OPENAD_SCHEDULERS_DISABLED:-false}
      OPENAD_MQTT_INGEST_DISABLED: ${OPENAD_MQTT_INGEST_DISABLED:-false}

      RABBITMQ_PROVISION_DEVICE_MQTT_USERS: 'true'

      # Primeiro `super_admin` do portal. `UsersService.seedAdminUser` só age quando a coleção
      # de usuários está **vazia**, então isto não é um backdoor permanente: depois do primeiro
      # boot bem-sucedido, mudar estas variáveis não cria nem altera ninguém.
      #
      # Sem elas o portal sobe sem ninguém para entrar — não há tela de cadastro de operador,
      # por desenho. Os valores vêm do `.env`, gerados por `infra/server/20-admin-inicial.sh`.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}

      LOG_LEVEL: ${LOG_LEVEL:-info}
    deploy:
      resources:
        limits:
          memory: 768M
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.openad-api.rule=Host(`adsapi.opendriver.com.br`)
      - traefik.http.routers.openad-api.entrypoints=https
      - traefik.http.routers.openad-api.tls.certresolver=letsencrypt
      - traefik.http.services.openad-api.loadbalancer.server.port=3000
    logging: *log

  # -------------------------------------------------------------------------------------
  # Portal do operador
  # -------------------------------------------------------------------------------------
  management:
    build:
      context: .
      dockerfile: Dockerfile.management
    image: openad-management:latest
    container_name: openad-management
    restart: unless-stopped
    networks: [coolify]
    deploy:
      resources:
        limits:
          memory: 64M
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.openad-portal.rule=Host(`ads.opendriver.com.br`)
      - traefik.http.routers.openad-portal.entrypoints=https
      - traefik.http.routers.openad-portal.tls.certresolver=letsencrypt
      - traefik.http.services.openad-portal.loadbalancer.server.port=80
    logging: *log
