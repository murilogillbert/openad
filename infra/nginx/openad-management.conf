# Nginx do portal do openad.
#
# Serve um aplicativo de página única: tudo que não é arquivo existente cai no `index.html`,
# porque as rotas (`/campaigns`, `/moderation`, ...) só existem no roteador do Angular. Sem o
# `try_files`, recarregar a página numa rota interna devolve 404 — defeito clássico de SPA
# atrás de servidor estático.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # O TLS termina no Traefik do Coolify, que repassa em HTTP na rede interna. Confiar no
    # `X-Forwarded-Proto` aqui é correto **porque** a porta 80 não é publicada: só o proxy a
    # alcança.
    absolute_redirect off;

    # Compressão. `gzip_static off` de propósito: o build do Angular não gera `.gz`, e deixar
    # ligado faria o Nginx procurar arquivo que não existe a cada requisição.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/manifest+json image/svg+xml;

    # Os arquivos com hash no nome podem ser cacheados para sempre: mudança de conteúdo muda
    # o nome. É o que torna a navegação seguinte instantânea.
    #
    # A regex vai **entre aspas** porque contém `{8,}`: sem elas o nginx lê a chave como
    # início de bloco e recusa a configuração com `unknown directive`, o que derruba o
    # contêiner no boot.
    location ~* "\.[0-9a-f]{8,}\.(js|css|woff2?|png|jpg|jpeg|svg|webp|ico)$" {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # O `index.html`, ao contrário, **nunca** pode ser cacheado: ele é o que aponta para os
    # bundles com hash. Um `index.html` velho em cache serve bundles que já não existem, e o
    # usuário vê tela branca até limpar o cache — falha que o operador não consegue
    # reproduzir e o usuário não sabe descrever.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires    0;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cabeçalhos de segurança. Sem CSP aqui de propósito: o Angular com estilos em componente
    # exige `style-src 'unsafe-inline'`, e uma CSP que permite isso dá uma falsa sensação de
    # proteção. A CSP correta precisa de nonce gerado no SSR, que esta imagem não tem.
    add_header X-Content-Type-Options "nosniff"        always;
    add_header X-Frame-Options        "DENY"           always;
    add_header Referrer-Policy        "no-referrer"    always;

    # Não revelar a versão do Nginx.
    server_tokens off;
}
